[package]
name = "localmind"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
dunce = "1"
# Resolves OS well-known folders (Downloads/Desktop/Documents/Pictures/Home)
# for the agent's "known folder" file-access tools.
dirs = "5"
rfd = { version = "0.15", default-features = false }
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
cron = "0.12"
chrono = "0.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# zip/unzip for the agent's compress_files/extract_archive tools.
zip = { version = "2", default-features = false, features = ["deflate"] }
# PDF tools (pdf_merge/pdf_to_text): lopdf for low-level page/object merging,
# pdf-extract for text extraction. Neither renders pages to images — that
# needs a real PDF renderer (pdfium/poppler), deliberately out of scope for
# now rather than shipping something fragile on machines without one installed.
lopdf = "0.34"
pdf-extract = "0.7"
# WP5.4 local IPC listener (src/ipc.rs): tiny_http is a small blocking HTTP
# server (no axum/hyper needed for two endpoints); getrandom is already
# resolved transitively (uuid's v4 feature pulls a newer getrandom, but 0.2's
# stable getrandom() function API is what we use here — Cargo is fine with
# two coexisting major versions of the same crate).
tiny_http = "0.12"
getrandom = "0.2"

# Shadow git version control (coding-agent overhaul, workstream 4): vendors
# its own libgit2 build (bundled feature), so no external git binary is
# required — consistent with rusqlite's bundled sqlite above.
git2 = { version = "0.19", features = ["vendored-libgit2"] }

# Window control + screen capture (WP5.2b) are Windows-only; other targets
# compile without this crate and return a runtime "unsupported" Err instead.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
] }

